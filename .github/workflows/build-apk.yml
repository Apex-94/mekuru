name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App flavor'
        required: true
        default: 'parallel'
        type: choice
        options:
          - parallel
          - play
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: gradle-

      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.vfs.watch=false
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate environment config
        run: dart run environment_config:generate

      - name: Build Android APK (Fat APK)
        run: |
          FLAVOR="${{ inputs.flavor || 'parallel' }}"
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          echo "Building flavor: $FLAVOR, type: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            # Build unsigned release APK
            flutter build apk --release --flavor "$FLAVOR" --no-pub
          else
            flutter build apk --debug --flavor "$FLAVOR" --no-pub
          fi

      - name: Build Split per ABI APKs (arm64 & x86_64)
        run: |
          FLAVOR="${{ inputs.flavor || 'parallel' }}"
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            flutter build apk --release --flavor "$FLAVOR" --target-platform android-arm64 --split-per-abi --no-pub
          else
            flutter build apk --debug --flavor "$FLAVOR" --target-platform android-arm64 --split-per-abi --no-pub
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mekuru-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
